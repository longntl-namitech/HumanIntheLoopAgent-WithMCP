<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HITL Agent</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </span>
        <span class="brand-name">HITL Agent</span>
      </div>

      <button id="new-chat" class="new-chat" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>

      <a class="side-link" href="/docs" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
        <span>API docs</span>
      </a>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <h1 id="chat-title">New chat</h1>
        <button id="copy-chat" class="header-btn" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span id="copy-label">Copy chat</span>
        </button>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Ask me something..." aria-label="Message"></textarea>
        <button id="send" class="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></svg>
        </button>
      </form>
    </main>

    <aside class="history">
      <h2>History</h2>
      <ul id="history-list" class="history-list"></ul>
      <button id="delete-history" class="delete-history" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        <span id="delete-label">Delete history</span>
      </button>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
