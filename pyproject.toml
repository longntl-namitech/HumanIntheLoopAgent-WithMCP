[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-agent"
version = "1.0.0"
description = "Human-in-the-loop LangGraph agent with MCP tools, a FastAPI backend and a web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain>=0.3.27,<0.4",
    "langgraph>=0.6.7,<0.7",
    "langchain-openai>=0.3.33,<0.4",
    "langchain-mcp-adapters>=0.1.9,<0.2",
    "mcp>=1.14,<2",
    "fastmcp>=2.12.3,<3",
    "langfuse>=3.3.4,<4",
    "fastapi>=0.116.1,<0.133",  # 0.133+ uses Starlette 1.x, which removed add_event_handler
    "uvicorn>=0.35,<1",
    "pydantic-settings>=2.10.1,<3",
    "python-dotenv>=1.1.1,<2",
    "loguru>=0.7.3,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hitl_agent = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
